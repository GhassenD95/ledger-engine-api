version: '3.8'

services:
  # =========================================================================
  # Primary Transactional Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_app
      POSTGRES_PASSWORD: 1995
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Distributed Cache / Idempotency State Guard
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: ledger_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Asynchronous Event Message Broker
  # =========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ledger_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP Protocol Port
      - "15672:15672"   # Web Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Ledger Engine Application
  # =========================================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ledger_app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_DATASOURCE_PASSWORD: 1995
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
