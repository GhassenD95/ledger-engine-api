# Render deployment — minimal dependencies
spring.web.resources.static-locations=file:/app/static/,classpath:/static/
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Redis (handled gracefully by IdempotencyGuard)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# Disable RabbitMQ-dependent features
app.rabbitmq.enabled=false
